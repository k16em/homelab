---
- name: '必要なAURパッケージを追加する'
  kewlfft.aur.aur:
    name: '{{ item.name }}'
    state: present
  with_items: '{{ required_aur_packages }}'

- name: 'hermes用のユーザを作成する'
  become: true
  ansible.builtin.user:
    name: hermes
    shell: /usr/bin/zsh
    password: "{{ vault_maintainer_password | password_hash('sha512') }}"

- name: 'hermesユーザにopencodeをセットアップする'
  ansible.builtin.include_role:
    name: opencode
  vars:
    opencode_user: hermes
