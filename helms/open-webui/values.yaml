image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""
  pullPolicy: IfNotPresent

secretKey:
  existingSecret: ""
  existingSecretKey: secret-key
  value: ""

database:
  host: ""
  port: 5432
  name: ""
  user: ""
  existingSecret: ""
  existingSecretKey: password
  vectorDB: true

offlineMode: true

env: []

envFrom: []

persistence:
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

service:
  network: ""
  loadBalancerIP: ""
  hostname: ""
  ports:
    - name: http
      port: 80
  labels: {}
  annotations: {}

resources: {}

gateway:
  enabled: false
  className: cilium
  hostname: ""
  network: private
  loadBalancerIP: ""
  servicePortName: http
  annotations: {}
  tls:
    secretName: ""
    certificate:
      create: true
      issuerRef:
        name: homelab-ca
        kind: ClusterIssuer
        group: cert-manager.io
      duration: 2160h
      renewBefore: 720h

nodeSelector: {}

tolerations: []

affinity: {}
