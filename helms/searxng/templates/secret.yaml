{{- if and (not .Values.secretKey.existingSecret) .Values.secretKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.fullname" . }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secretKey.existingSecretKey }}: {{ .Values.secretKey.value | b64enc | quote }}
{{- end }}
