---
- name: '必要なパッケージを追加する'
  become: true
  community.general.pacman:
    name: '{{ hermes_package_manifest.repository }}'
    state: installed

- name: '必要なAURパッケージを追加する'
  kewlfft.aur.aur:
    name: '{{ hermes_package_manifest.aur }}'
    state: present

- name: 'hermes用のユーザを作成する'
  become: true
  ansible.builtin.user:
    name: hermes
    shell: /usr/bin/zsh
    password_lock: true

- name: 'hermesユーザにopencodeをセットアップする'
  ansible.builtin.include_role:
    name: opencode
  vars:
    opencode_user: hermes
