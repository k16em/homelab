---
llm_backend_package_manifest:
  repository:
    - clang
    - vulkan-radeon
    - lib32-vulkan-radeon
    - rocm-hip-sdk
    - rocm-opencl-sdk
    - python
    - huggingface
    - gperftools
    - bc
    - python-pytorch-opt-rocm
    - amd-ucode
    - python-cairo
    - python-opencv
    - python-passlib
    - libxslt
    - python-lxml
    - python-hpack
    - python-hyperframe
    - python-h2
    - cuda
    - python-yaml
    - git
    - cmake
  aur:
    - zluda
    - llama.cpp-hip
    - llama-swap
    - python-primp
    - python-duckduckgo-search
    - python-whisper
    - python310
    - python311

llm_backend_llama_swap_bin: /usr/bin/llama-server
llm_backend_llama_swap_models_dir: /var/lib/models
llm_backend_llama_swap_config_dir: /etc/llama-swap
llm_backend_llama_swap_listen_port: 12434
llm_backend_llama_swap_health_check_timeout: 300
llm_backend_llama_swap_default_ttl: 600

llm_backend_llama_cpp_variants_dir: /opt/llama.cpp-variants
llm_backend_llama_cpp_variants_bin_dir: /usr/local/bin
llm_backend_llama_cpp_repo: https://github.com/ggml-org/llama.cpp
llm_backend_llama_cpp_build_timeout: 7200
llm_backend_llama_cpp_rocm_packages:
  - hip-runtime-amd
  - rocblas
  - hipblas
llm_backend_llama_cpp_build_env:
  HIP_PATH: /opt/rocm
  HIPCXX: /opt/rocm/lib/llvm/bin/clang
llm_backend_llama_cpp_cmake_args:
  - -DGGML_HIP=ON
  - -DAMDGPU_TARGETS=gfx1151
  - -DBUILD_SHARED_LIBS=OFF
  - -DCMAKE_BUILD_TYPE=Release

llm_backend_llama_swap_default_env:
  - 'HSA_OVERRIDE_GFX_VERSION=11.5.1'
  - 'HSA_ENABLE_SDMA=0'
  - 'ROCBLAS_USE_HIPBLASLT=1'
  - 'HIP_LAUNCH_BLOCKING=1'

gufo_models: []
llm_backend_gufo_repo: https://github.com/gufo-org/gufo
llm_backend_gufo_version: v0.8.0
llm_backend_gufo_dir: /opt/gufo
llm_backend_gufo_prefix: /opt/gufo/install
llm_backend_gufo_build_jobs: 4
llm_backend_gufo_build_timeout: 7200
llm_backend_gufo_packages:
  - gcc15
  - git
  - cmake
  - ninja
  - pkgconf
  - rocm-hip-sdk
  - hipblaslt
  - hipcub
  - rocprim
  - rocwmma
  - icu
  - curl
  - openssl
  - libpng
  - libjpeg-turbo
  - libwebp
  - ffmpeg
llm_backend_gufo_stamp_packages:
  - gcc15
  - rocm-llvm
  - cmake
  - hip-runtime-amd
  - hipblas
  - hipblaslt
  - rocblas
  - hipcub
  - rocprim
  - rocwmma
llm_backend_gufo_cmake_args:
  - '-DGUFO_RELEASE_VERSION={{ llm_backend_gufo_version }}'
  - -DCMAKE_C_COMPILER=/usr/bin/gcc-15
  - -DCMAKE_CXX_COMPILER=/usr/bin/g++-15
  - -DCMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang++
  - -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm
  - -DCMAKE_HIP_ARCHITECTURES=gfx1151
  - -DCMAKE_HIP_STANDARD=20
  - -DCMAKE_HIP_STANDARD_REQUIRED=ON
  - '-DCMAKE_HIP_FLAGS=--hip-path=/opt/rocm -std=c++20 -O2'
  - -DGUFO_BUILD_TOOLS=OFF
llm_backend_gufo_env: []
