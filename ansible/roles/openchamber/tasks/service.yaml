---
- name: 'OpenChamberの実行用ユーザー情報を取得する'
  ansible.builtin.getent:
    database: passwd
    key: '{{ openchamber_user }}'

- name: 'OpenChamberの実行用ユーザーのlingerを有効化する'
  become: true
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - '{{ openchamber_user }}'
    creates: '/var/lib/systemd/linger/{{ openchamber_user }}'

- name: 'OpenChamberの実行用ユーザーのsystemd managerを起動する'
  become: true
  ansible.builtin.systemd_service:
    name: 'user@{{ ansible_facts["getent_passwd"][openchamber_user][1] }}.service'
    state: started

- name: 'OpenChamberのuser unit用ディレクトリを作成する'
  become: true
  ansible.builtin.file:
    path: '{{ ansible_facts["getent_passwd"][openchamber_user][4] }}/.config/systemd/user'
    state: directory
    owner: '{{ openchamber_user }}'
    group: '{{ openchamber_group }}'
    mode: '0755'

- name: 'OpenChamberのUI認証用EnvironmentFileを配置する'
  become: true
  ansible.builtin.template:
    src: openchamber.env.j2
    dest: '{{ ansible_facts["getent_passwd"][openchamber_user][4] }}/.config/systemd/user/openchamber.env'
    owner: '{{ openchamber_user }}'
    group: '{{ openchamber_group }}'
    mode: '0600'
  no_log: true
  diff: false
  notify: 'OpenChamberを再起動する'

- name: 'OpenChamberのuser unitを配置する'
  become: true
  ansible.builtin.template:
    src: openchamber.service.j2
    dest: '{{ ansible_facts["getent_passwd"][openchamber_user][4] }}/.config/systemd/user/openchamber.service'
    owner: '{{ openchamber_user }}'
    group: '{{ openchamber_group }}'
    mode: '0644'
  notify: 'OpenChamberを再起動する'

- name: 'OpenChamberのuser serviceを有効化して起動する'
  become: true
  become_user: '{{ openchamber_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_facts["getent_passwd"][openchamber_user][1] }}'
    DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ ansible_facts["getent_passwd"][openchamber_user][1] }}/bus'
  ansible.builtin.systemd_service:
    name: openchamber.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
