---
required_packages:
  - name: clang
  - name: vulkan-radeon
  - name: lib32-vulkan-radeon
  - name: rocm-hip-sdk
  - name: rocm-opencl-sdk
  - name: python
  - name: huggingface
  - name: gperftools
  - name: bc
  - name: python-pytorch-opt-rocm
  - name: amd-ucode
  - name: python-cairo
  - name: python-opencv
  - name: python-passlib
  - name: libxslt
  - name: python-lxml
  - name: python-hpack
  - name: python-hyperframe
  - name: python-h2
  - name: cuda
  - name: python-yaml

required_aur_packages:
  - name: zluda
  - name: "llama.cpp-hip"
  - name: llama-swap
  - name: python-primp
  - name: python-duckduckgo-search
  - name: python-whisper
  - name: python310
  - name: python311

llama_swap_bin: /usr/bin/llama-server
llama_swap_models_dir: /var/lib/models
llama_swap_config_dir: /etc/llama-swap
llama_swap_listen_port: 12434
llama_swap_health_check_timeout: 300
llama_swap_default_ttl: 600

llama_swap_default_env:
  - 'HSA_OVERRIDE_GFX_VERSION=11.5.1'
  - 'HSA_ENABLE_SDMA=0'
  - 'ROCBLAS_USE_HIPBLASLT=1'

# モデル定義は group_vars/all/vault の vault_llama_swap_models に置く。
# opencodeにも出したいモデルには opencode: を足すこと（roles/opencode を参照）。
# ロールの vars は group_vars より優先度が高いため、ここには書かないこと。
