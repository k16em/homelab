---
opencode_packages:
  - name: opencode
  - name: python

# opencodeの設定を置く対象のユーザ。このロールはユーザを作らないので、
# 呼び出し側のロールが作成済みのユーザ名を渡すこと。
opencode_user: opencode

opencode_provider_id: llama.cpp
opencode_provider_name: llama-swap(tk)
opencode_base_url: 'http://{{ vault_local_llm_ip }}:12434/v1'
opencode_default_model: '{{ opencode_provider_id }}/{{ vault_opencode_default_model }}'
