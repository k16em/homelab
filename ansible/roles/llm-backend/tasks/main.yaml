---
- name: '必要なパッケージを追加する'
  become: true
  community.general.pacman:
    name: '{{ llm_backend_package_manifest.repository }}'
    state: installed

- name: '必要なAURパッケージを追加する'
  kewlfft.aur.aur:
    name: '{{ llm_backend_package_manifest.aur }}'
    state: present

- name: 'llmグループを作成する'
  become: true
  ansible.builtin.group:
    name: llm
    state: present

- name: 'モデル用ディレクトリを掘る'
  become: true
  ansible.builtin.file:
    path: '{{ llm_backend_llama_swap_models_dir }}'
    state: directory
    owner: root
    group: llm
    mode: '2750'

- name: 'llama.cppのビルドに関わるROCmのバージョンを取得する'
  ansible.builtin.command:
    argv: '{{ ["pacman", "-Q"] + llm_backend_llama_cpp_rocm_packages }}'
  register: llm_backend_llama_cpp_rocm_query
  changed_when: false
  check_mode: false

- name: 'ROCmのバージョンを記録する'
  ansible.builtin.set_fact:
    llm_backend_llama_cpp_rocm_versions: '{{ llm_backend_llama_cpp_rocm_query.stdout_lines }}'

- name: 'variantのllama.cppをビルドする'
  ansible.builtin.include_tasks: llama-cpp-variant.yaml
  loop: '{{ llama_cpp_variants }}'
  loop_control:
    loop_var: variant
    label: '{{ variant.name }}'

- name: 'llama-swapのサービスユニットファイルを上書きする用のディレクトリを作成する'
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/llama-swap.service.d/
    state: "directory"
    mode: '0755'

- name: 'llama-swapの上書き用ユニットファイルを置く'
  become: true
  ansible.builtin.template:
    src: llama-swap.override.conf.j2
    dest: /etc/systemd/system/llama-swap.service.d/override.conf
    mode: '0644'

- name: 'llama-swap.serviceを有効化'
  become: true
  ansible.builtin.systemd:
    state: started
    enabled: true
    daemon_reload: true
    name: llama-swap

- name: 'llama-swapの設定用ディレクトリを掘る'
  become: true
  ansible.builtin.file:
    path: '{{ llm_backend_llama_swap_config_dir }}'
    state: directory
    owner: root
    mode: '0755'

- name: 'llama-swapの設定ファイルを置く'
  become: true
  ansible.builtin.template:
    src: llama-swap.config.yaml.j2
    dest: '{{ llm_backend_llama_swap_config_dir }}/config.yaml'
    mode: '0644'
    validate: '/usr/bin/python -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" %s'
  diff: false
