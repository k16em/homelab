---
- name: "rsyncを入れる"
  become: true
  community.general.pacman:
    name: '{{ upgrade_packages_package_manifest.repository | select("equalto", "rsync") | first }}'
    state: latest

- name: "キャッシュを同期する"
  become: true
  ansible.posix.synchronize:
    mode: pull
    src: 'rsync://{{ pacman_cache_server }}/{{ ansible_architecture }}/'
    dest: /var/cache/pacman/pkg/
  delegate_to: '{{ inventory_hostname }}'
  when:
    - pacman_cache_server is defined
    - ansible_host | default(inventory_hostname) != pacman_cache_server

- name: "archlinux-keyringを先に更新かける"
  become: true
  community.general.pacman:
    name: '{{ upgrade_packages_package_manifest.repository | select("equalto", "archlinux-keyring") | first }}'
    state: latest

- name: "pacman-contribを入れる"
  become: true
  community.general.pacman:
    name: '{{ upgrade_packages_package_manifest.repository | select("equalto", "pacman-contrib") | first }}'
    state: latest

- name: "pacman -Syyuする"
  become: true
  community.general.pacman:
    update_cache: yes
    upgrade: yes
  register: result

- name: "更新されたパッケージがあるなら、再起動"
  become: true
  ansible.builtin.reboot:
    msg: "Ansibleでパッケージ更新があったので、再起動します"
  when:
    - result.changed
    - "not 'jenkins' in group_names"

- name: "pacmanのキャッシュを消す"
  become: true
  ansible.builtin.command:
    cmd: paccache --remove --keep 3
  register: paccache
  changed_when: paccache.stdout | length > 0
