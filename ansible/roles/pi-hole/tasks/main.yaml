---
- name: 'pi-holeの稼動に必要なパッケージをインストール'
  become: true
  community.general.pacman:
    name: '{{ pi_hole_package_manifest.repository }}'
    state: present

- name: 'pi-holeをインストール'
  kewlfft.aur.aur:
    name: '{{ pi_hole_package_manifest.aur }}'
    state: present
  notify: 'pihole-FTLを再起動する'

- name: 'pihole-FTLが実行できるか確認'
  ansible.builtin.command:
    cmd: 'pihole-FTL --version'
  register: pi_hole_ftl_version
  changed_when: false
  failed_when: false

- name: 'pihole-FTLを再ビルド'
  when: pi_hole_ftl_version.rc != 0
  block:
    - name: 'ビルド用の一時ディレクトリを作成'
      ansible.builtin.tempfile:
        state: directory
        suffix: pi-hole-ftl
      register: pi_hole_ftl_build_dir

    - name: 'pi-hole-ftlのPKGBUILDを取得'
      ansible.builtin.unarchive:
        src: 'https://aur.archlinux.org/cgit/aur.git/snapshot/pi-hole-ftl.tar.gz'
        dest: '{{ pi_hole_ftl_build_dir.path }}'
        remote_src: true

    - name: 'pi-hole-ftlをビルドして入れ直す'
      ansible.builtin.command:
        cmd: 'makepkg --syncdeps --install --noconfirm --force'
        chdir: '{{ pi_hole_ftl_build_dir.path }}/pi-hole-ftl'
      changed_when: true
      notify: 'pihole-FTLを再起動する'

    - name: '再ビルド後にpihole-FTLが実行できるか確認'
      ansible.builtin.command:
        cmd: 'pihole-FTL --version'
      changed_when: false

  always:
    - name: 'ビルド用の一時ディレクトリを削除'
      ansible.builtin.file:
        path: '{{ pi_hole_ftl_build_dir.path }}'
        state: absent
      when: pi_hole_ftl_build_dir.path is defined

- name: 'pihole-FTL.serviceを有効化'
  become: true
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: pihole-FTL

- name: 'resolvdの追加設定用ディレクトリを掘る'
  become: true
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: "directory"
    mode: '0755'

- name: 'resolvedの設定を置く'
  become: true
  ansible.builtin.copy:
    src: pi-hole.conf
    dest: /etc/systemd/resolved.conf.d/pi-hole.conf
    mode: '0644'
  notify:
    - 'systemd-resolvedを再起動する'
    - 'pihole-FTLを再起動する'

- name: 'adlistを更新'
  become: true
  ansible.builtin.command:
    cmd: 'pihole -g'
  changed_when: true
  tags: pi_hole_update
