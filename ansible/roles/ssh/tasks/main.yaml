---
- name: '~/.ssh/conf.dディレクトリを掘る'
  ansible.builtin.file:
    path: ~/.ssh/conf.d
    state: "directory"
    mode: '0700'

- name: '~/ssh/configを置く'
  ansible.builtin.copy:
    src: config
    dest: ~/.ssh/config
    mode: '0600'

- name: 'tailscaleの接続情報を作成する'
  ansible.builtin.template:
    src: site.j2
    dest: ~/.ssh/conf.d/{{ item.prefix }}
    mode: '0600'
  diff: false
  with_items: 
  - { prefix: "ts", hosts: "{{tailscale_hosts}}" }

- name: '各拠点の接続情報を作成する'
  ansible.builtin.template:
    src: site.j2
    dest: ~/.ssh/conf.d/{{ item.prefix }}
    mode: '0600'
  diff: false
  with_items: 
  - { prefix: "tk", hosts: "{{ssh_site01_hosts}}", bastion: "{{facing_bastion}}" }
  - { prefix: "tk-pv", hosts: "{{ssh_site01_private_hosts}}", bastion: "{{facing_bastion}}" }
  - { prefix: "iw", hosts: "{{ssh_site02_hosts}}", bastion: "{{facing_bastion}}" }
