---
- name: 'kubeadmのバージョンを取得する'
  ansible.builtin.command:
    cmd: kubeadm version --output short
  register: kubernetes_control_plane_kubeadm_version
  changed_when: false
  check_mode: false

- name: 'kubeadmの設定を置く'
  become: true
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: '0600'

- name: 'admin.confがあるか確認する'
  become: true
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubernetes_control_plane_admin_conf

- name: 'control planeのマニフェストがあるか確認する'
  become: true
  ansible.builtin.find:
    paths: /etc/kubernetes/manifests
    patterns: '*.yaml'
  register: kubernetes_control_plane_manifests

- name: '途中まで初期化された状態でないことを確認する'
  ansible.builtin.assert:
    that:
      - kubernetes_control_plane_admin_conf.stat.exists == (kubernetes_control_plane_manifests.matched > 0)
    fail_msg: >-
      kubeadm initが途中で止まっている可能性がある
      (admin.conf: {{ kubernetes_control_plane_admin_conf.stat.exists }},
      マニフェスト: {{ kubernetes_control_plane_manifests.files | map(attribute='path') | list }})。
      状態を確認し、必要ならkubeadm resetしてから再実行する
    quiet: true

- name: 'control planeを初期化する'
  become: true
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not kubernetes_control_plane_admin_conf.stat.exists

- name: 'APIサーバーが応答するか確認する'
  become: true
  ansible.builtin.command:
    argv:
      - timeout
      - '300'
      - sh
      - -c
      - until kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz; do sleep 5; done
  register: kubernetes_control_plane_readyz
  changed_when: false
  failed_when: false
  check_mode: false
  when: not ansible_check_mode or kubernetes_control_plane_admin_conf.stat.exists

- name: 'APIサーバーが正常であることを確認する'
  ansible.builtin.assert:
    that:
      - kubernetes_control_plane_readyz.rc == 0
    fail_msg: >-
      admin.confはあるがAPIサーバーが/readyzに応答しない。
      kubeadm initが途中で止まっている可能性がある。
      状態を確認し、必要ならkubeadm resetしてから再実行する: {{ kubernetes_control_plane_readyz.stderr }}
    quiet: true
  when: kubernetes_control_plane_readyz is not skipped

- name: 'クラスタのkubeadm設定を取得する'
  become: true
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf
      --namespace kube-system get configmap kubeadm-config
      --output jsonpath={.data.ClusterConfiguration}
  register: kubernetes_control_plane_cluster_config
  changed_when: false
  failed_when: false
  check_mode: false
  when: kubernetes_control_plane_readyz is not skipped

- name: 'クラスタのkubeadm設定が変数と一致することを確認する'
  ansible.builtin.assert:
    that:
      - kubernetes_control_plane_cluster_config.rc == 0
      - actual == expected
    fail_msg: >-
      クラスタの設定が変数と異なる、または取得できない。
      init後の設定変更はこのロールでは反映しないため、変数を戻すかクラスタを作り直す。
      期待: {{ expected }}, 実際: {{ actual }}, stderr: {{ kubernetes_control_plane_cluster_config.stderr }}
    quiet: true
  vars:
    cluster_config: "{{ kubernetes_control_plane_cluster_config.stdout | default('{}', true) | from_yaml }}"
    actual:
      podSubnet: "{{ cluster_config.networking.podSubnet | default(None) }}"
      serviceSubnet: "{{ cluster_config.networking.serviceSubnet | default(None) }}"
      controlPlaneEndpoint: "{{ cluster_config.controlPlaneEndpoint | default(None) }}"
    expected:
      podSubnet: '{{ kubernetes_control_plane_pod_subnet }}'
      serviceSubnet: '{{ kubernetes_control_plane_service_subnet }}'
      controlPlaneEndpoint: '{{ kubernetes_control_plane_advertise_address }}:{{ kubernetes_control_plane_port }}'
  when: kubernetes_control_plane_cluster_config is not skipped

- name: 'kubeconfigを置くディレクトリを作成する'
  become: true
  ansible.builtin.file:
    path: '~{{ kubernetes_control_plane_kubeconfig_user }}/.kube'
    state: directory
    owner: '{{ kubernetes_control_plane_kubeconfig_user }}'
    group: '{{ kubernetes_control_plane_kubeconfig_user }}'
    mode: '0700'

- name: 'kubeconfigを置く'
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: '~{{ kubernetes_control_plane_kubeconfig_user }}/.kube/config'
    remote_src: true
    owner: '{{ kubernetes_control_plane_kubeconfig_user }}'
    group: '{{ kubernetes_control_plane_kubeconfig_user }}'
    mode: '0600'

- name: 'Ciliumのリリースの状態を取得する'
  become: true
  become_user: '{{ kubernetes_control_plane_kubeconfig_user }}'
  ansible.builtin.command:
    cmd: helm status cilium --namespace kube-system --output json
  register: kubernetes_control_plane_cilium_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: 'Ciliumのリリースが正常か未インストールであることを確認する'
  ansible.builtin.assert:
    that:
      - >-
        (kubernetes_control_plane_cilium_status.rc == 0 and (kubernetes_control_plane_cilium_status.stdout | from_json).info.status == 'deployed')
        or (kubernetes_control_plane_cilium_status.rc != 0 and 'release: not found' in kubernetes_control_plane_cilium_status.stderr)
    fail_msg: >-
      Ciliumのリリースがdeployedではない。状態を確認し、必要ならhelm uninstallしてから再実行する:
      {{ (kubernetes_control_plane_cilium_status.stdout | from_json).info.status
      if kubernetes_control_plane_cilium_status.rc == 0 else kubernetes_control_plane_cilium_status.stderr }}
    quiet: true

- name: 'Ciliumをインストールする'
  become: true
  become_user: '{{ kubernetes_control_plane_kubeconfig_user }}'
  ansible.builtin.command:
    argv: "{{ ['cilium-cli', 'install', '--version', kubernetes_control_plane_cilium_version] + (kubernetes_control_plane_cilium_options | map('regex_replace', '^', '--set=') | list) }}"
  when: kubernetes_control_plane_cilium_status.rc != 0

- name: 'Ciliumが動くまで待つ'
  become: true
  become_user: '{{ kubernetes_control_plane_kubeconfig_user }}'
  ansible.builtin.command:
    cmd: cilium-cli status --wait --wait-duration 10m
  changed_when: false
  check_mode: false
