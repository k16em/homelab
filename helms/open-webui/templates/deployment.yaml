apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-webui.fullname" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-webui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-webui.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.offlineMode }}
      initContainers:
        - name: seed-cache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - tar -C /app/backend/data -cf - cache | tar -C /data -xf - --skip-old-files
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: open-webui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-webui.secretName" . }}
                  key: {{ .Values.secretKey.existingSecretKey }}
            {{- if .Values.offlineMode }}
            - name: OFFLINE_MODE
              value: "true"
            {{- end }}
            {{- with .Values.database }}
            {{- if .host }}
            {{- if not (and .name .user .existingSecret) }}
            {{- fail "database.host を指定するときは database.name、database.user、database.existingSecret も指定する必要がある" }}
            {{- end }}
            - name: DATABASE_TYPE
              value: postgresql
            - name: DATABASE_HOST
              value: {{ .host | quote }}
            - name: DATABASE_PORT
              value: {{ .port | quote }}
            - name: DATABASE_NAME
              value: {{ .name | quote }}
            - name: DATABASE_USER
              value: {{ .user | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretKey }}
            {{- if .vectorDB }}
            - name: VECTOR_DB
              value: pgvector
            - name: PGVECTOR_CREATE_EXTENSION
              value: "false"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "open-webui.claimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
