---
- name: '必要なパッケージを追加する'
  become: true
  community.general.pacman:
    name: '{{ hermes_package_manifest.repository }}'
    state: installed

- name: '必要なAURパッケージを追加する'
  kewlfft.aur.aur:
    name: '{{ hermes_package_manifest.aur }}'
    state: present

- name: 'hermes用のユーザを作成する'
  become: true
  ansible.builtin.user:
    name: hermes
    shell: /usr/bin/zsh
    password_lock: true

- name: 'hermesユーザのSSH接続設定を配布する'
  tags: hermes_ssh_config
  block:
    - name: 'hermes用の.sshディレクトリを作成する'
      become: true
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: hermes
        group: hermes
        mode: '0700'
      loop:
        - '~hermes/.ssh'
        - '~hermes/.ssh/conf.d'

    - name: 'hermes用のhomelab接続設定を配置する'
      become: true
      ansible.builtin.template:
        src: ssh_config.j2
        dest: '~hermes/.ssh/conf.d/homelab'
        owner: hermes
        group: hermes
        mode: '0600'
        validate: '/usr/bin/ssh -G -F %s localhost'
      diff: false

    - name: 'hermes用のSSH configを配置する'
      become: true
      ansible.builtin.copy:
        src: ssh_config
        dest: '~hermes/.ssh/config'
        owner: hermes
        group: hermes
        mode: '0600'
        validate: '/usr/bin/ssh -G -F %s localhost'

- name: 'hermesユーザにopencodeをセットアップする'
  ansible.builtin.include_role:
    name: opencode
  vars:
    opencode_user: hermes
