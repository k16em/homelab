{{- if .Values.gateway.enabled }}
{{- if or .Values.service.network .Values.service.loadBalancerIP .Values.service.hostname }}
{{- fail "GatewayでHTTPSを公開するときは service.network、service.loadBalancerIP、service.hostname を空にしてbackendをClusterIPにしてください。公開設定はgateway側に指定します" }}
{{- end }}
{{- $hostname := required "gateway.hostname を指定してください" .Values.gateway.hostname }}
{{- $network := required "gateway.network を指定してください" .Values.gateway.network }}
{{- $secretName := .Values.gateway.tls.secretName | default (printf "%s-tls" (include "open-webui.fullname" .)) }}
{{- $backendPort := 0 }}
{{- $matchedPorts := 0 }}
{{- range .Values.service.ports }}
{{- if eq .name $.Values.gateway.servicePortName }}
{{- $backendPort = .port }}
{{- $matchedPorts = add $matchedPorts 1 }}
{{- end }}
{{- end }}
{{- if ne (int $matchedPorts) 1 }}
{{- fail "gateway.servicePortName に対応するService portを1つ指定してください" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "open-webui.fullname" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className | quote }}
  infrastructure:
    labels:
      homelab/network: {{ $network | quote }}
    annotations:
      external-dns.kubernetes.io/hostname: {{ $hostname | quote }}
  {{- with .Values.gateway.loadBalancerIP }}
  addresses:
    - type: IPAddress
      value: {{ . | quote }}
  {{- end }}
  listeners:
    - name: https
      hostname: {{ $hostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $secretName }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "open-webui.fullname" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "open-webui.fullname" . }}
      sectionName: https
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "open-webui.fullname" . }}
          port: {{ $backendPort }}
{{- if .Values.gateway.tls.certificate.create }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "open-webui.fullname" . }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  secretName: {{ $secretName }}
  dnsNames:
    - {{ $hostname | quote }}
  duration: {{ .Values.gateway.tls.certificate.duration | quote }}
  renewBefore: {{ .Values.gateway.tls.certificate.renewBefore | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ required "gateway.tls.certificate.issuerRef.name を指定してください" .Values.gateway.tls.certificate.issuerRef.name | quote }}
    kind: {{ .Values.gateway.tls.certificate.issuerRef.kind | quote }}
    group: {{ .Values.gateway.tls.certificate.issuerRef.group | quote }}
{{- end }}
{{- end }}
